[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "or-small-models-benchmark"
version = "0.1.0"
description = "Reproducible benchmark for small language models on operations-research problems"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
solver = ["gurobipy>=11,<13"]
analysis = ["matplotlib>=3.9,<4", "pandas>=2.2,<3", "scipy>=1.14,<2"]

[project.scripts]
or-small-models = "or_small_models.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
